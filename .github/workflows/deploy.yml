name: Build Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/pluviophile714/zashboardx
      METRICS_IMAGE: ghcr.io/pluviophile714/zashboardx
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Metrics helper tests
        run: pnpm metrics:test

      - name: Build
        env:
          SINGBOX_NATIVE: true
        run: pnpm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish metrics helper image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.metrics-helper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.METRICS_IMAGE }}:metrics-latest
            ${{ env.METRICS_IMAGE }}:metrics-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
