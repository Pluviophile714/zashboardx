name: Sync Upstream and Build Image

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: master
      UPSTREAM_REPO: https://github.com/Zephyruso/zashboard.git
      IMAGE: ghcr.io/pluviophile714/zashboardx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream main

      - name: Check for updates
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          if ! git merge upstream/main --no-edit; then
            git merge --abort || true
            echo "Merge conflict with upstream/main. Please resolve manually." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify merged result
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm run type-check
          pnpm run build

      - name: Push merged master
        if: steps.check.outputs.up_to_date == 'false'
        run: git push origin "$BASE_BRANCH"

      - name: Set up QEMU
        if: steps.check.outputs.up_to_date == 'false'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.up_to_date == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.check.outputs.up_to_date == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        if: steps.check.outputs.up_to_date == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
